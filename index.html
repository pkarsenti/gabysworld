<style>

/* ================= marker drawing helpers ================= */
function rp(s){let t=(s*1013904223+1664525)>>>0;t^=t<<13;t>>>=0;t^=t>>>17;t^=t<<5;t>>>=0;return t/4294967296;}
function stroke(w,col){x.lineWidth=w;x.strokeStyle=col||INK;x.lineCap='round';x.lineJoin='round';}
function rline(x1,y1,x2,y2,s,amp){
  amp=amp==null?3:amp;x.beginPath();x.moveTo(x1,y1);
  for(let i=1;i<=3;i++){const t=i/3;let px=x1+(x2-x1)*t,py=y1+(y2-y1)*t;
    if(i<3){px+=(rp(s+i*7)-.5)*amp;py+=(rp(s+i*7+3)-.5)*amp;}x.lineTo(px,py);}
  x.stroke();}
function rrect(X,Y,W,H,s,amp){rline(X,Y,X+W,Y,s,amp);rline(X+W,Y,X+W,Y+H,s+11,amp);
  rline(X+W,Y+H,X,Y+H,s+23,amp);rline(X,Y+H,X,Y,s+37,amp);}
function rcircPath(cx,cy,r,s,sq){sq=sq||1;x.beginPath();
  for(let i=0;i<=16;i++){const a=i/16*Math.PI*2,rr=r*(1+(rp(s+i)-.5)*.14);
    const px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr*sq;i?x.lineTo(px,py):x.moveTo(px,py);}
  x.closePath();}
function rcirc(cx,cy,r,s,sq){rcircPath(cx,cy,r,s,sq);x.stroke();}
function fillCirc(cx,cy,r,s,col){rcircPath(cx,cy,r,s);x.fillStyle=col||INK;x.fill();}
function cloud(cx,cy,r,s){const n=7;x.beginPath();
  for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rr=r*(1+(rp(s+i)-.5)*.18);
    const px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr*.78;
    if(!i){x.moveTo(px,py);continue;}
    const am=a-Math.PI/n;
    x.quadraticCurveTo(cx+Math.cos(am)*rr*1.5,cy+Math.sin(am)*rr*1.15,px,py);}
  x.stroke();}
function star(cx,cy,r,s){for(let i=0;i<3;i++){const a=i*Math.PI/3+rp(s+i)*.4;
  rline(cx-Math.cos(a)*r,cy-Math.sin(a)*r,cx+Math.cos(a)*r,cy+Math.sin(a)*r,s+i*5,r*.22);}}
function heart(cx,cy,r){x.beginPath();x.arc(cx-r*.5,cy-r*.2,r*.5,0,7);x.arc(cx+r*.5,cy-r*.2,r*.5,0,7);
  x.moveTo(cx-r,cy+r*.1);x.lineTo(cx,cy+r);x.lineTo(cx+r,cy+r*.1);x.fill();}
function flower(cx,cy,r,s){for(let i=0;i<6;i++){const a=i/6*Math.PI*2;
  rline(cx+Math.cos(a)*r*.5,cy+Math.sin(a)*r*.5,cx+Math.cos(a)*r*1.5,cy+Math.sin(a)*r*1.5,s+i*3,2);}
  fillCirc(cx,cy,r*.5,s+40);}
function potted(px,py,s){rline(px,py,px,py-30,s,2);flower(px,py-38,10,s+9);
  rline(px,py-18,px-12,py-26,s+21,2);rrect(px-14,py-14,28,14,s+31,2);}
function wave(x0,x1,y,s){const n=Math.max(1,Math.round((x1-x0)/22));x.beginPath();x.moveTo(x0,y);
  for(let i=0;i<n;i++){const a=x0+(x1-x0)*i/n,b=x0+(x1-x0)*(i+1)/n;
    x.quadraticCurveTo((a+b)/2,y-11,b,y);}x.stroke();}
function note(cx,cy,s){fillCirc(cx,cy,7,s);rline(cx+6,cy-2,cx+8,cy-24,s+5,1.5);rline(cx+8,cy-24,cx+20,cy-18,s+9,1.5);}
function shadow(px,py,w){x.save();x.globalAlpha=.14;x.fillStyle=INK;
  x.beginPath();x.ellipse(px,py+4,w,6,0,0,7);x.fill();x.restore();}
function drawLook(px,py,look,s,r){
  if(look==='curl'){fillCirc(px-r*.7,py-r*.85,r*.5,s);fillCirc(px,py-r*1.15,r*.55,s+3);fillCirc(px+r*.7,py-r*.85,r*.5,s+6);}
  if(look==='spike'){for(let i=-1;i<2;i++)rline(px+i*r*.6,py-r*.8,px+i*r*.95,py-r*1.9,s+i*7,1.5);}
  if(look==='bun'){fillCirc(px+r*.2,py-r*1.35,r*.55,s);}
  if(look==='bob'){x.fillStyle=INK;x.beginPath();x.arc(px,py,r*1.12,Math.PI*1.03,Math.PI*1.97);x.fill();
    x.fillRect(px-r*1.12,py-r*.35,r*.38,r*1.25);x.fillRect(px+r*.74,py-r*.35,r*.38,r*1.25);}
  if(look==='cap'){x.fillStyle=INK;x.fillRect(px-r*1.5,py-r*.55,r*3,r*.55);x.fillRect(px-r*.9,py-r*1.45,r*1.8,r*1);}
  if(look==='party'){x.fillStyle=INK;x.beginPath();x.moveTo(px-r*.9,py-r*.75);x.lineTo(px,py-r*2.9);
    x.lineTo(px+r*.9,py-r*.75);x.fill();fillCirc(px,py-r*3.1,r*.32,s);}
  if(look==='crown'){x.fillStyle=INK;x.beginPath();x.moveTo(px-r*1.15,py-r*.65);x.lineTo(px-r*1.15,py-r*1.85);
    x.lineTo(px-r*.58,py-r*1.15);x.lineTo(px,py-r*2.05);x.lineTo(px+r*.58,py-r*1.15);x.lineTo(px+r*1.15,py-r*1.85);
    x.lineTo(px+r*1.15,py-r*.65);x.closePath();x.fill();}}

  fillCirc(px-H*.34,hy-H*.06,2.7*s,sd+7);fillCirc(px+H*.34,hy-H*.06,2.7*s,sd+9);
  if(o.look)drawLook(px,hy,o.look,sd+100,H);
  if(o.hat)drawLook(px,hy,o.hat,sd+200,H);
  stroke(7*s,o.accent||INK);rline(px,hy+H*.9,px,hip,sd+5,1.5);

  if(o.arms==='up'){rline(px,sh+4*s,px-16*s,sh-18*s,sd+9,2);rline(px,sh+4*s,px+16*s,sh-18*s,sd+11,2);}

    rline(px,sh+4*s,px+15*s,sh-16*s+Math.sin(t*.15)*7*s,sd+11,2);}

function seated(px,py,o){                      // sitting on a chair, facing right

  stroke(7*s,o.accent||INK);rline(px,hy+HR*s*.9,px,py-34*s,sd+5,1.5);
  stroke(6*s);
  if(o.hand)rline(px,py-58*s,px+4*s,py-92*s,sd+11,2);

function floorBounds(px,py){          // the walkable strip you are actually standing on
  let inside=null,nearest=null,nd=1e9;
  PLATS.forEach(p=>{if(Math.abs(p.y-py)>6)return;
    if(px>=p.x0&&px<=p.x1){if(!inside||(p.x1-p.x0)<(inside.x1-inside.x0))inside=p;}
    const d=px<p.x0?p.x0-px:(px>p.x1?px-p.x1:0);
    if(d<nd){nd=d;nearest=p;}});
  const best=inside||(nd<260?nearest:null);
  if(!best)return{lo:-1e9,hi:1e9};
  return{lo:best.x0+36,hi:best.x1-36};}

/* ================= update ================= */
function activePlats(){return PLATS.filter(p=>flying?p.z==='plane':true);}
function stepNPCs(){
  NPC.forEach(n=>{
    if(n.waveT>0)n.waveT--;
    if(n.toSeesaw){                                   // one child runs to the seesaw and calls you over
      const goal=SEE.x+SEE.arm-14;
      n.x+=Math.sign(goal-n.x)*2.2;n.walk=(n.walk||0)+.22;
      if(Math.abs(n.x-goal)<4){n.x=goal;n.onSeesaw=1;n.walk=0;
        if(!P.seesaw&&t%260===0){say(n.x,n.y-150,'come on the seesaw!');tune([660,880],130);}}
      return;}
    if(n.seat){n.x+=(n.desk-n.x)*.08;n.y=GY;n.walk=0;return;}
    if(!n.range)return;
    if(n.pause>0){n.pause--;n.walk*=.85;return;}
    n.x+=n.dir*n.spd;n.walk=(n.walk||0)+.2;
    if(n.x<n.home-n.range){n.x=n.home-n.range;n.dir=1;}
    if(n.x>n.home+n.range){n.x=n.home+n.range;n.dir=-1;}
    if(Math.random()<.004)n.pause=50+Math.random()*90;
    if(Math.random()<.003)n.dir*=-1;});}
function update(){
  t++;
  if(R){raceUpdate();return;}
  if(disco&&Math.abs(P.x-6100)<1100&&!flying)startMusic('disco');
  else if(musName==='disco')stopMusic();
  if(P.water>0)P.water--;
  if(P.bath>0)P.bath--;
  if(P.tv>0)P.tv--;
  if(CAR.horn>0)CAR.horn--;
  if(P.dance>0){P.dance--;if(t%22===0)puff(P.x+20,P.y-100,1,'note');}
  if(partyT>0)partyT--;
  tilt=flying?Math.sin(t*.02)*.012:tilt*.9;
  if(disco&&t%14===0)puff(6300+Math.random()*260,TR.floor-40,1,'note');
  if(recess&&t%40===0)puff(8560+Math.random()*280,GY-120,1,'star');
  stepNPCs();

  if(CAR.driving){
    if(key.left){CAR.vx-=.36;CAR.face=-1;}
    if(key.right){CAR.vx+=.36;CAR.face=1;}
    if(!key.left&&!key.right)CAR.vx*=.94;
    CAR.vx=Math.max(-9,Math.min(9,CAR.vx));
    CAR.x=Math.max(60,Math.min(W.w-60,CAR.x+CAR.vx));
    P.x=CAR.x;P.y=GY;
    if(Math.abs(CAR.vx)>4&&t%9===0)puff(CAR.x-CAR.face*80,GY-6,1,'crumb');
    if(grabEdge){CAR.horn=26;mark('honk');tune([250,200],130,'square');}
    if(actEdge)doAct();
    actEdge=upEdge=downEdge=grabEdge=false;
    pushTrail();stepFollowers();stepBits();return;}

  if(P.seesaw){                                      // riding the seesaw
    const e=seesawEnds();P.x=e.lx;P.y=e.ly;
    if(t%34===0)tone(300+Math.sin(t*.055)*160,.07,'triangle',.03);
    if(key.left||key.right||actEdge){P.seesaw=false;P.x=SEE.x-SEE.arm-40;P.y=GY;P.vy=0;mark('seesaw');}
    actEdge=upEdge=downEdge=grabEdge=false;pushTrail();stepFollowers();stepBits();return;}
  if(P.slide!==null){
    P.slide+=.014;const s=Math.min(1,P.slide),i=1-s;
    P.x=i*i*SLIDE.x0+2*i*s*SLIDE.cx+s*s*SLIDE.x1;
    P.y=i*i*SLIDE.y0+2*i*s*SLIDE.cy+s*s*SLIDE.y1;
    if(s>=1){P.slide=null;P.y=GY;P.vy=0;say(P.x,P.y-110,'wheee');}
    actEdge=upEdge=downEdge=grabEdge=false;pushTrail();stepFollowers();stepBits();return;}
  if(P.nap>0){P.nap--;if(P.nap%36===0)puff(P.x+20,P.y-70,1,'z');
    if(actEdge||key.left||key.right)P.nap=0;
    actEdge=upEdge=downEdge=grabEdge=false;pushTrail();stepFollowers();stepBits();return;}
  if(P.sit>0){P.sit--;if(key.left||key.right||actEdge)P.sit=0;
    actEdge=upEdge=downEdge=grabEdge=false;pushTrail();stepFollowers();stepBits();return;}
  if(P.bath>0&&(key.left||key.right))P.bath=0;
  if(P.tv>0&&(key.left||key.right))P.tv=0;
  if(P.balls>0){P.balls--;if(key.left||key.right)P.balls=0;}

  if(P.climb){
    const L=P.climb;P.climbT++;
    if((key.left||key.right)&&P.climbT>12){P.climb=null;P.face=key.left?-1:1;P.vy=0;}
    else{P.x=L.x;
      if(key.up)P.y-=3.1;if(key.down)P.y+=3.1;
      P.walk+=(key.up||key.down)?.26:0;
      if((key.up||key.down)&&t%12===0)tone(240+((t*11)%80),.03,'square',.012);
      if(P.y<=L.y0){P.y=L.y0;P.climb=null;P.vy=0;}
      if(P.y>=L.y1){P.y=L.y1;P.climb=null;P.vy=0;}}
  }else{
    const sp=(P.balls>0||P.bath>0)?1.7:3.8;
    if(key.left){P.x-=sp;P.face=-1;P.walk+=.2;}
    if(key.right){P.x+=sp;P.face=1;P.walk+=.2;}
    if(!key.left&&!key.right)P.walk*=.86;
    if((key.left||key.right)&&P.ground&&t%13===0)tone(78+((t*7)%26),.035,'triangle',.014);
    if(flying)P.x=Math.max(PLANE.x0+50,Math.min(PLANE.x1-80,P.x));
    else P.x=Math.max(20,Math.min(W.w-40,P.x));
    let climbed=false;
    for(const L of LADS){
      if(flying&&(L.z==='board'||L.z==='shaft'))continue;
      if(Math.abs(P.x-L.x)>34)continue;
      if(upEdge&&Math.abs(P.y-L.y1)<12){P.climb=L;P.climbT=0;P.y=L.y1-1;climbed=true;break;}
      if(downEdge&&Math.abs(P.y-L.y0)<12){P.climb=L;P.climbT=0;P.y=L.y0+1;climbed=true;break;}}
    if(!climbed){
      if(upEdge&&P.ground){P.vy=-9.2;P.ground=false;slide(400,640,.12,'sine',.035);}
      const prev=P.y;P.vy+=.55;P.y+=P.vy;P.ground=false;
      if(P.vy>0)for(const p of activePlats())
        if(P.x>p.x0&&P.x<p.x1&&prev<=p.y+1&&P.y>=p.y){
          if(P.vy>6)tone(120,.06,'triangle',.03);P.y=p.y;P.vy=0;P.ground=true;}
      if(flying&&P.y>PLANE.floor){P.y=PLANE.floor;P.vy=0;P.ground=true;}
      if(P.y>LAB.floor+220){P.y=GY;P.vy=0;}}}
  if(grabEdge){
    if(P.held!==null){const it=ITEMS[P.held];place(it,P.x+26*P.face,P.y);
      P.held=null;beep(300,.08,'sine',.04);}
    else{const i=nearItem(false);
      if(i!==null){P.held=i;const fi=followers.indexOf(ITEMS[i]);
        if(fi>=0)followers.splice(fi,1);            // picking your friend up ends the parade
        beep(680,.08,'sine',.04);}
      else if(P.hat){const h=spawn(P.hat,P.x,P.y);P.held=ITEMS.indexOf(h);P.hat=null;beep(500,.08,'sine',.04);}}}
  if(P.held!==null){const it=ITEMS[P.held];it.x=P.x+22*P.face;it.y=P.y-62;}
  if(actEdge)doAct();
  actEdge=upEdge=downEdge=grabEdge=false;
  pushTrail();stepFollowers();stepBits();}
function pushTrail(){const last=trail[0];
  if(!last||Math.abs(last.x-P.x)+Math.abs(last.y-P.y)>7){
    trail.unshift({x:P.x,y:P.y});if(trail.length>320)trail.pop();}}
function stepFollowers(){
  followers.forEach((f,i)=>{
    if(P.held!==null&&ITEMS[P.held]===f)return;
    const idx=Math.min(trail.length-1,(i+1)*15);
    const tp=trail[idx];
    if(tp){f.x+=(tp.x-f.x)*.25;f.y+=(tp.y-f.y)*.25;}
    const ahead=i===0?P:followers[i-1];      // never crowd whoever is in front of you
    const want=i===0?76:66;
    let dx=f.x-ahead.x,dy=f.y-ahead.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<1){f.x=ahead.x-(P.face||1)*want;return;}
    if(d<want){const k=(want-d)/d;f.x+=dx*k;f.y+=dy*k*.25;}});}
function stepBits(){
  for(let i=bubbles.length-1;i>=0;i--){bubbles[i].t++;if(bubbles[i].t>150)bubbles.splice(i,1);}
  for(let i=bits.length-1;i>=0;i--){const b=bits[i];b.t++;b.x+=b.vx;b.y+=b.vy;
    b.vy+=(b.kind==='z'||b.kind==='heart'||b.kind==='note'||b.kind==='bub')?-.02:.07;
    if(b.t>92)bits.splice(i,1);}}

const RW=900,RH=560,LAP=3400,LAPS=3;
const LANEY=[300,378,456],LANES=[.78,.9,1.02];
const TOPSPD=13,FIELD=12;
function ord(n){return n+(n===1?'st':n===2?'nd':n===3?'rd':'th');}
const ordinal=ord;
function buildGrid(){
  /* each car runs 60%-95% of your top speed, and starts far enough up the road
     that you reel them in one at a time all race long, not all in lap one */
  const g=[];
  for(let i=0;i<FIELD;i++){
    let f=.60+(i/(FIELD-1))*.30;
    if(i>=FIELD-2)f-=.05;                        // ease off the front-runners
    const base=+(TOPSPD*f).toFixed(2);
    const catchAt=80*Math.pow(9.5,i/(FIELD-1));   // when you should draw level, in frames
    g.push({base,frac:f,d:Math.round((TOPSPD-base)*catchAt*0.7)});}
  g.sort((p1,p2)=>p1.d-p2.d);
  g.forEach((r,i)=>r.lane=i%3);
  [0,1,2].forEach(l=>{const lane=g.filter(r=>r.lane===l).sort((p1,p2)=>p1.d-p2.d);
    for(let i=1;i<lane.length;i++)
      if(lane[i].d-lane[i-1].d<95)lane[i].d=lane[i-1].d+95;});
  return g;}
function startRace(){
  mark('race');
  R={d:0,spd:0,lane:1,ly:1,lap:1,t:0,count:200,done:false,shake:0,place:1,bump:0,horn:0,
     rivals:buildGrid().map((r,i)=>({d:r.d,lane:r.lane,spd:r.base*.8,base:r.base,frac:r.frac,s:11+i*37,beep:0,cool:0,swap:0}))};
  stopMusic();engineOn();tune([392,392,392],420,'square');}
function endRace(){R=null;engineOff();stopMusic();
  P.x=RACE.arch-140;P.y=GY;CAR.x=RACE.arch-40;CAR.driving=false;}
function raceUpdate(){
  R.t++;if(R.shake>0)R.shake--;if(R.bump>0)R.bump--;if(R.horn>0)R.horn--;
  if(R.count>0){R.count--;
    if(R.count===200-1)tune([392],1,'square');
    if(R.count===132||R.count===66)tone(392,.18,'square',.06);
    if(R.count===0){tone(784,.5,'square',.07);startMusic('race');}
    R.ly+=(R.lane-R.ly)*.2;engineSet(0);
    actEdge=upEdge=downEdge=grabEdge=false;return;}
  if(R.done){
    engineOff();
    R.spd*=.97;R.d+=R.spd;R.ly+=(R.lane-R.ly)*.2;
    if(R.t%7===0)raceBits();
    if(actEdge||grabEdge)endRace();
    actEdge=upEdge=downEdge=grabEdge=false;return;}
  /* driving */
  if(key.right)R.spd+=.21;
  if(key.left)R.spd-=.34;
  if(!key.right)R.spd-=.045;
  R.spd=Math.max(0,Math.min(TOPSPD,R.spd));
  if(upEdge&&R.lane>0){R.lane--;tone(660,.06,'square',.03);}
  if(downEdge&&R.lane<2){R.lane++;tone(560,.06,'square',.03);}
  R.ly+=(R.lane-R.ly)*.18;
  if(grabEdge){R.horn=22;tune([260,208],120,'square');}
  const before=R.d;R.d+=R.spd;
  engineSet(R.spd);
  if(R.spd>10&&R.t%4===0)tone(1600+Math.random()*400,.02,'square',.004);
  /* rivals: each runs its own share of your pace, and pulls out to overtake */
  R.rivals.forEach((rv,ri)=>{
    const target=Math.max(4.6,Math.min(rv.base,R.spd*rv.frac));
    rv.spd+=(target-rv.spd)*.04;
    if(rv.swap>0)rv.swap--;
    if(rv.beep>0)rv.beep--;
    if(rv.cool>0)rv.cool--;
    let blocked=null;
    R.rivals.forEach((o,oi)=>{if(oi===ri||o.lane!==rv.lane)return;
      const g2=o.d-rv.d;

    if(blocked){

        if(nl<0||nl>2)continue;

        if(clear){rv.lane=nl;rv.swap=70;moved=true;break;}}
      if(!moved)rv.spd=Math.min(rv.spd,blocked.spd*.99);}
    rv.d+=rv.spd;
    const gap=rv.d-R.d;
    if(rv.cool<=0&&Math.abs(gap)<70&&Math.abs(rv.lane-R.ly)<.5){    // a nudge, not a wall
      R.spd*=.78;rv.spd*=.92;R.shake=14;R.bump=24;rv.beep=30;rv.cool=70;
      crunch(.16,.06);tone(180,.12,'square',.05);

  if(((before%LAP)>(R.d%LAP))){                              // crossed the line

      const win=R.place===1;

  x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,innerWidth,innerHeight);
  x.save();
  x.translate(innerWidth/2,innerHeight/2);x.scale(scale,scale);x.rotate(tilt);x.translate(-cam.x,-cam.y);

  drawSky(cam);
  if(!flying){
    drawGround(cam);drawLab(cam);
    drawHouse1();drawHouse2();drawBridge();drawPlayhouse();
    drawBathHouse();drawTruck();drawTown();drawSchool();drawRaceGate();drawLadders();drawLamppost();}
  drawPlane();
  if(!flying)drawSigns(cam);
  NPC.forEach((n,i)=>{
    if(flying&&n.z!=='plane')return;
    if(n.x<cam.x-VW/2-90||n.x>cam.x+VW/2+90)return;
    const dancing=disco&&n.dance;
    const hop=(n.hop&&recess)?Math.abs(Math.sin(t*.13+i))*14:(dancing?Math.abs(Math.sin(t*.15+i))*10:0);
    if(n.onSeesaw){const e=seesawEnds();
      figure(e.rx,e.ry,{look:n.look,seed:3100+i*37,arms:P.seesaw?'up':'wave',s:.95});return;}
    if(n.seat){seated(n.x,n.y,{look:n.look,seed:3100+i*37,hand:n.hand});return;}
    figure(n.x,n.y-hop,{look:n.look,walk:n.walk,seed:3100+i*37,
      arms:n.waveT>0?'wave':(dancing||(n.hop&&recess)||n.teacher?'up':'down')});});
  if(!flying)drawCar();
  ITEMS.forEach((it,i)=>{
    if(it.x<cam.x-VW/2-90||it.x>cam.x+VW/2+90)return;
    if(flying&&(it.x<PLANE.x0||it.x>PLANE.x1)&&P.held!==i)return;
    const isFol=followers.indexOf(it)>=0;
    const bob=DEF[it.kind].pet&&P.held!==i
      ?(isFol?Math.abs(Math.sin(t*.18+i))*5:Math.abs(Math.sin(t*.06+i))*3)
      :(it.kind==='balloon'?Math.sin(t*.05+i)*3:0);
    itemArt(it.kind,it.x,it.y,i*97+13,bob);});
  drawPlayer();

  for(const b of bits){
    const a=1-b.t/92;x.save();x.globalAlpha=a;stroke(4);
    if(b.kind==='z'){x.font='700 20px "Comic Sans MS",cursive';x.fillStyle=INK;x.textAlign='center';x.fillText('z',b.x,b.y);}
    else if(b.kind==='heart'){x.fillStyle=INK;heart(b.x,b.y,7);}
    else if(b.kind==='ball')rcirc(b.x,b.y,9,b.s);
    else if(b.kind==='bub')rcirc(b.x,b.y,7,b.s);
    else if(b.kind==='crumb')fillCirc(b.x,b.y,4,b.s);
    else if(b.kind==='note')note(b.x,b.y,b.s);
    else star(b.x,b.y,7,b.s);
    x.restore();}
  for(const b of bubbles)bubble(b.x,b.y-60,b.txt,Math.min(1,(150-b.t)/40));

  if(P.slide===null&&!P.climb&&P.nap<=0&&started){
    const plan=actPlan();
    if(plan){ring(plan.x,plan.y);bubble(P.x,P.y-116+Math.sin(t*.12)*3,'★ '+plan.txt,.95,true);}
    if(!CAR.driving&&P.held===null){
      const i=nearItem(true);
      if(i!==null&&(!plan||plan.k==='thing'||plan.k==='hello'))handHint(ITEMS[i].x+28,ITEMS[i].y-46);}}
  x.restore();

  x.save();x.setTransform(DPR,0,0,DPR,0,0);
  if(partyT>0){x.textAlign='center';x.font='700 26px "Comic Sans MS",cursive';
    x.fillStyle=INK;x.fillText('you did everything!',innerWidth/2,innerHeight-30);
    if(t%6===0)puff(P.x+(Math.random()-.5)*220,P.y-180,2);}
  if(!started){
    x.fillStyle='rgba(245,239,225,.94)';x.fillRect(0,0,innerWidth,innerHeight);
    x.fillStyle=INK;x.textAlign='center';
    x.font='700 32px "Comic Sans MS","Chalkboard SE",cursive';
    x.fillText("Gaby's World",innerWidth/2,innerHeight/2-104);
    x.font='700 17px "Comic Sans MS",cursive';
    ['◀ ▶ walk,  ▲ hop,  ▲ ▼ climb ladders','★ does whatever the orange ring is around',
     '✋ picks up anything with a yellow glow','★ a pet to bring it along, ✋ to carry it again',
     'ring the school bell, then try the seesaw','🏁 drive to the far right and race!'].forEach((l,i)=>
      x.fillText(l,innerWidth/2,innerHeight/2-44+i*29));
    x.font='700 15px "Comic Sans MS",cursive';
    x.fillText('press anything to start',innerWidth/2,innerHeight/2+178);
    x.save();x.translate(innerWidth/2,innerHeight/2-150);
    figure(0,0,{s:.85,look:'curl',hat:'party',accent:ACCENT,arms:'up',seed:777});x.restore();}
  x.restore();}
(function loop(){update();R?raceDraw():draw();requestAnimationFrame(loop);})();
</script>
